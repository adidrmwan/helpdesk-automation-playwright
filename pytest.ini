[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --html=reports/report.html
    --self-contained-html
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --alluredir=allure-results
    --clean-alluredir

markers =
    smoke: pengecekan cepat bahwa halaman-halaman utama bisa dibuka
    regression: test all cases
    login: run test for login
    e2e: running specific end to end
    e2e-create-account: running end to end for creating account
